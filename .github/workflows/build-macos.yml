name: macOS builds

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build-macos.yml'
      - '.github/workflows/builds.yml'
      - 'contrib/osx/**'
      - 'contrib/make_libsecp256k1.sh'
      - 'contrib/make_libusb.sh'
      - 'contrib/make_zxing.sh'
      - 'contrib/build_tools_util.sh'
      - 'contrib/deterministic-build/**'
      - 'contrib/release.sh'
      - 'contrib/make_download'

permissions:
  contents: read

jobs:
  macos:
    name: 'build: macOS (${{ matrix.arch }})'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Build unsigned app and DMG
        run: ./contrib/osx/make_osx.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: electrum-macos-${{ matrix.arch }}-${{ github.sha }}
          path: dist/*.dmg
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
